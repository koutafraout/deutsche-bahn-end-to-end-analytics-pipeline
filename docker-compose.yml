name: db-ops-analytics

x-spark-common: &spark-common
  image: spark:3.5.8-scala2.12-java17-python3-ubuntu
  restart: unless-stopped
  # Opt-in only — development-time profiling (notebooks/data-assessment/),
  # not part of the orchestrated pipeline (Airflow never talks to Spark).
  # Excluded from a plain `docker compose up`; start explicitly with
  # `docker compose --profile profiling up -d` (see docs/runbook.md §2.5).
  # SPARK_WORKER_MEMORY below assumes Spark runs alone, without the rest
  # of this stack (Airflow/Metabase/Postgres) competing for the same
  # Docker Desktop VM memory — bump Docker Desktop's memory allocation to
  # comfortably exceed it before profiling (see docs/runbook.md §2.5).
  profiles:
    - profiling
  networks:
    - spark-network
  volumes:
    # Downloaded source data: static GTFS, historical delays, and samples.
    - ./data:/opt/spark/work-dir/data

    # Spark validation outputs: CSV, JSON, and Parquet.
    - ./output:/opt/spark/work-dir/output

services:
  spark-master:
    <<: *spark-common
    container_name: db-ops-spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    <<: *spark-common
    container_name: db-ops-spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - "10"
      - --memory
      - 8G
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "10"
      SPARK_WORKER_MEMORY: 8G
      SPARK_WORKER_WEBUI_PORT: "8081"
    ports:
      - "8081:8081"

  spark-jupyter:
    <<: *spark-common
    container_name: db-ops-spark-jupyter
    hostname: spark-jupyter
    user: root
    working_dir: /opt/spark/work-dir
    depends_on:
      - spark-master
      - spark-worker
    environment:
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      SPARK_MASTER_URL: spark://spark-master:7077
    volumes:
      # Notebooks created in JupyterLab.
      - ./notebooks:/opt/spark/work-dir/notebooks

      # Same shared folders used by the Spark cluster.
      - ./data:/opt/spark/work-dir/data
      - ./output:/opt/spark/work-dir/output
    command:
      - bash
      - -lc
      - |
        PY4J_ZIP="$$(find /opt/spark/python/lib -maxdepth 1 -name 'py4j-*.zip' -print -quit)" &&
        test -n "$$PY4J_ZIP" &&
        export PYTHONPATH="/opt/spark/python:$$PY4J_ZIP:$${PYTHONPATH:-}" &&
        python3 -m pip install --no-cache-dir jupyterlab &&
        python3 -m jupyter lab \
          --ip=0.0.0.0 \
          --port=8888 \
          --no-browser \
          --allow-root \
          --ServerApp.root_dir=/opt/spark/work-dir \
          --ServerApp.token='' \
          --ServerApp.password=''
    ports:
      # Bound to localhost only; no token is required.
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"

  metabase:
    image: metabase/metabase:latest
    container_name: db-ops-metabase
    restart: unless-stopped
    # Uses Metabase's built-in embedded app database (H2), persisted to a
    # named volume — this project's data volume doesn't warrant a
    # separate Postgres container just for Metabase's own metadata.
    # Metabase connects to Redshift Serverless directly over the network
    # (public endpoint) via the UI, not through docker-compose networking.
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    image: postgres:16
    container_name: db-ops-postgres
    restart: unless-stopped
    # Local mirror of the Redshift Gold marts for offline dashboard work —
    # see dashboard/local-postgres-mirror.md. Not a warehouse replacement
    # (ADR 0002); Metabase's connection is repointed here manually, not
    # via compose networking wiring beyond DNS resolution of "postgres".
    environment:
      POSTGRES_DB: gold_marts
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  # Airflow's own metadata DB (task/DAG state) — unrelated to the
  # "postgres" service above, which mirrors Gold marts.
  airflow-postgres:
    image: postgres:16
    container_name: db-ops-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: db-ops-airflow-init
    depends_on:
      - airflow-postgres
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      # Read-only mount of the host's AWS profile so boto3 (ingestion,
      # quality) can authenticate to S3 without duplicating credentials
      # into .env. Requires `~/.aws/credentials` (or an SSO/config setup)
      # to already be set up on the host.
      - ~/.aws:/home/airflow/.aws:ro

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: db-ops-airflow-webserver
    restart: unless-stopped
    depends_on:
      - airflow-init
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      # Read-only mount of the host's AWS profile so boto3 (ingestion,
      # quality) can authenticate to S3 without duplicating credentials
      # into .env. Requires `~/.aws/credentials` (or an SSO/config setup)
      # to already be set up on the host.
      - ~/.aws:/home/airflow/.aws:ro
    ports:
      # 8080 (spark-master) and 8081 (spark-worker) are already taken above.
      - "127.0.0.1:8082:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: db-ops-airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      # Read-only mount of the host's AWS profile so boto3 (ingestion,
      # quality) can authenticate to S3 without duplicating credentials
      # into .env. Requires `~/.aws/credentials` (or an SSO/config setup)
      # to already be set up on the host.
      - ~/.aws:/home/airflow/.aws:ro
    command: scheduler

networks:
  spark-network:
    driver: bridge

volumes:
  metabase-data:
  postgres-data:
  airflow-postgres-data: